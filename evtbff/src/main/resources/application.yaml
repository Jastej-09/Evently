spring:
  application:
    name: evtbff


  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled=true:



  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evently}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: "evt-platform-super-secret-key-2026-this-must-be-long-enough"
  access-token-expiration: 900000

evt:
  open-service:
    url: ${EVT_OPEN_SERVICE_URL:http://localhost:8081}
  notification-service:
    url: ${EVT_NOTIFICATION_SERVICE_URL:http://localhost:8083}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [traceId=%X{traceId}] [%thread] %logger{36} - %msg%n"
