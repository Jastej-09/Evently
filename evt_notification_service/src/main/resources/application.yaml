server:
  port: 8083

spring:

  application:
    name: evt-notification-service

  # =========================
  # MongoDB
  # =========================
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/event_notification_db}
      uuid-representation: standard


  # =========================
  # Kafka
  # =========================
  kafka:

    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

    consumer:

      group-id: notification-service

      auto-offset-reset: earliest

      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer

      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:

        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        spring.json.trusted.packages: "*"

        spring.json.value.default.type: com.evt_notification_service.evtnotificationservice.model.EventMessage

    producer:

      key-serializer: org.apache.kafka.common.serialization.StringSerializer

      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    listener:

      ack-mode: manual

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [traceId=%X{traceId}] [%thread] %logger{36} - %msg%n"