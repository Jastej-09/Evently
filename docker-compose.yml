services:

  # =========================
  # Infrastructure
  # =========================

  postgres:
    image: postgres:17
    container_name: evt-postgres
    environment:
      POSTGRES_DB: evently
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - evt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evently"]
      interval: 10s
      timeout: 5s
      retries: 5


  mongo:
    image: mongo:8
    container_name: evt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - evt-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: evt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - evt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
      image: apache/kafka:4.0.0
      container_name: evt-kafka
      ports:
        - "29092:29092"

      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller

        # Two listeners:
        # INTERNAL -> Docker containers
        # EXTERNAL -> Your local Spring Boot apps
        KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      volumes:
        - kafka-data:/var/lib/kafka/data

      networks:
        - evt-network

  kafbat-ui:
    image: kafbat/kafka-ui:latest
    container_name: evt-kafbat-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: evently-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - evt-network

  # =========================
  # Microservices
  # =========================

  event-core-service:
    build:
      context: eventcoreservice
      dockerfile: dockerfile
    container_name: event-core-service
    ports:
      - "8082:8082"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evently
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evt-network


  event-open-service:
    build:
      context: eventopenservice
      dockerfile: dockerfile
    container_name: event-open-service
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_HOST: event-core-service
      GRPC_PORT: 9090
    depends_on:
      event-core-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - evt-network


  notification-service:
    build:
      context: evt_notification_service
      dockerfile: dockerfile
    container_name: evt-notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/event_notification_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - evt-network


  bff:
    build:
      context: evtbff
      dockerfile: dockerfile
    container_name: evt-bff
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/evently
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EVT_OPEN_SERVICE_URL: http://event-open-service:8081
      EVT_NOTIFICATION_SERVICE_URL: http://evt-notification-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      event-open-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - evt-network


# =========================
# Volumes
# =========================

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  kafka-data:


# =========================
# Network
# =========================

networks:
  evt-network:
    driver: bridge